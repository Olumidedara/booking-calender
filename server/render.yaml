services:
  - type: web
    name: booking-calendar-server
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npx tsx src/index.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://your-app.vercel.app
        # Update this to your actual Vercel URL after deploying
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/health
